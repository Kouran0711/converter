name: Build e publicar release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex.: 1.3.1)'
        required: true
        default: '1.3.1'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Mostrar ambiente
        shell: pwsh
        run: |
          dotnet --info
          git --version

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Definir versão
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag.TrimStart('v')
          }
          else {
            $version = '${{ inputs.version }}'.Trim()
            $tag = "v$version"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Versão inválida: $version. Use 1.2.3 ou 1.2.3.4."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $version"
          Write-Host "Tag: $tag"

      - name: Publicar aplicativo e instalador
        shell: pwsh
        run: |
          .\scripts\Publish.ps1 -Installer -Version '${{ steps.version.outputs.version }}'

      - name: Criar pacote portátil, manifesto e checksums
        id: assets
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $installer = Get-ChildItem .\artifacts\installer\*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) { throw 'Instalador não encontrado.' }

          $portable = Join-Path $installer.Directory.FullName 'NITH Converter Portable.zip'
          Compress-Archive -Path .\artifacts\publish\win-x64\* -DestinationPath $portable -Force

          function Get-Sha256Hex([string]$Path) {
            $sha = [Security.Cryptography.SHA256]::Create()
            $stream = [IO.File]::OpenRead($Path)
            try {
              $bytes = $sha.ComputeHash($stream)
              return ([BitConverter]::ToString($bytes)).Replace('-', '').ToLowerInvariant()
            }
            finally {
              $stream.Dispose()
              $sha.Dispose()
            }
          }

          $installerHash = Get-Sha256Hex $installer.FullName
          $portableHash = Get-Sha256Hex $portable
          "$installerHash  $($installer.Name)" |
            Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
          "$portableHash  $([IO.Path]::GetFileName($portable))" |
            Set-Content -LiteralPath "$portable.sha256" -Encoding ascii

          $manifestPath = Join-Path $installer.Directory.FullName 'nith-update.json'
          $manifest = [ordered]@{
            version = $version
            tag = $tag
            title = "NITH Converter $version"
            installer = $installer.Name
            sha256 = $installerHash
            size = $installer.Length
          } | ConvertTo-Json
          [IO.File]::WriteAllText($manifestPath, $manifest, [Text.UTF8Encoding]::new($false))

          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "portable=$portable" >> $env:GITHUB_OUTPUT
          "manifest=$manifestPath" >> $env:GITHUB_OUTPUT

      - name: Publicar ou atualizar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $installer = '${{ steps.assets.outputs.installer }}'
          $portable = '${{ steps.assets.outputs.portable }}'
          $manifest = '${{ steps.assets.outputs.manifest }}'

          $assets = @(
            $installer,
            "$installer.sha256",
            $portable,
            "$portable.sha256",
            $manifest
          )

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag já existe. Atualizando arquivos..."
            gh release upload $tag @assets --clobber
          }
          else {
            Write-Host "Criando release $tag..."
            gh release create $tag @assets `
              --target $env:GITHUB_SHA `
              --title "NITH Converter $tag" `
              --generate-notes
          }

      - name: Guardar artefatos do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NITH-Converter-${{ steps.version.outputs.version }}
          if-no-files-found: warn
          path: |
            artifacts/installer/*.exe
            artifacts/installer/*.sha256
            artifacts/installer/*.zip
            artifacts/installer/nith-update.json
