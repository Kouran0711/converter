name: Build e publicar release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex.: 1.7.1)'
        required: true
        default: '1.7.1'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Mostrar ambiente
        shell: pwsh
        run: |
          dotnet --info
          git --version

      - name: Instalar Inno Setup 6.7.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'

          & curl.exe --fail --location --silent --show-error --retry 4 --retry-delay 2 --output $setup $url
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao baixar o compilador Inno Setup 6.7.3.' }

          $sha = [Security.Cryptography.SHA256]::Create()
          $stream = [IO.File]::OpenRead($setup)
          try {
            $actual = ([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-', '').ToLowerInvariant()
          }
          finally {
            $stream.Dispose()
            $sha.Dispose()
          }
          if ($actual -ne $expected) { throw "SHA-256 inesperado do Inno Setup: $actual" }

          $proc = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Instalação do Inno Setup falhou com código $($proc.ExitCode)." }

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'ISCC.exe 6.7.3 não foi encontrado após a instalação.' }
          Write-Host "Inno Setup pronto: $iscc"

      - name: Definir versão
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag.TrimStart('v')
          }
          else {
            $version = '${{ inputs.version }}'.Trim()
            $tag = "v$version"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Versão inválida: $version. Use 1.2.3 ou 1.2.3.4."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $version"
          Write-Host "Tag: $tag"

      - name: Validar scripts e arquitetura do instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem -Path . -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::Erro de sintaxe PowerShell"
              foreach ($parseError in $errors) {
                Write-Host "  linha $($parseError.Extent.StartLineNumber): $($parseError.Message)"
              }
            }
          }
          if ($failed) { throw 'Há scripts PowerShell com erro de sintaxe.' }

          $iss = Get-Content .\Installer\NithConverter.iss -Raw
          foreach ($required in @('external download extractarchive', 'NeedImageMagick', 'NeedFFmpeg', 'NeedGhostscript', 'NeedVCRuntime')) {
            if ($iss -notmatch [regex]::Escape($required)) { throw "Instalador online incompleto: faltou $required" }
          }
          Write-Host 'Scripts e instalador online validados.'

      - name: Publicar aplicativo e instalador pequeno
        shell: pwsh
        run: |
          .\scripts\Publish.ps1 -Installer -Version '${{ steps.version.outputs.version }}'

      - name: Confirmar que dependências pesadas não foram baixadas no CI
        shell: pwsh
        run: |
          $unexpected = @(
            '.\artifacts\publish\win-x64\bin\ImageMagick\magick.exe',
            '.\artifacts\publish\win-x64\bin\FFmpeg\ffmpeg.exe',
            '.\artifacts\publish\win-x64\bin\Ghostscript\bin\gswin64c.exe'
          )
          foreach ($file in $unexpected) {
            if (Test-Path -LiteralPath $file) { throw "O CI voltou a incorporar uma dependência pesada: $file" }
          }
          Write-Host 'OK: dependências serão baixadas no PC do usuário pelo instalador.'

      - name: Criar manifesto e checksum do atualizador
        id: assets
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $installer = Get-ChildItem .\artifacts\installer\*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) { throw 'Instalador não encontrado.' }
          if ($installer.Name -ne 'NITH.Converter.exe') { throw "Nome inesperado do instalador: $($installer.Name)" }

          function Get-Sha256Hex([string]$Path) {
            $sha = [Security.Cryptography.SHA256]::Create()
            $stream = [IO.File]::OpenRead($Path)
            try {
              $bytes = $sha.ComputeHash($stream)
              return ([BitConverter]::ToString($bytes)).Replace('-', '').ToLowerInvariant()
            }
            finally {
              $stream.Dispose()
              $sha.Dispose()
            }
          }

          $installerHash = Get-Sha256Hex $installer.FullName
          "$installerHash  $($installer.Name)" |
            Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii

          $manifestPath = Join-Path $installer.Directory.FullName 'nith-update.json'
          $manifest = [ordered]@{
            schema = 3
            version = $version
            tag = $tag
            title = "NITH Converter $version"
            installer = $installer.Name
            sha256 = $installerHash
            size = $installer.Length
            installer_type = 'online'
            dependencies = @('ImageMagick', 'FFmpeg+FFprobe', 'Ghostscript', 'VC++ Runtime')
            release_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
            generated_utc = [DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText($manifestPath, $manifest, [Text.UTF8Encoding]::new($false))

          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "manifest=$manifestPath" >> $env:GITHUB_OUTPUT

      - name: Publicar ou atualizar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $installer = '${{ steps.assets.outputs.installer }}'
          $manifest = '${{ steps.assets.outputs.manifest }}'
          $assets = @($installer, "$installer.sha256", $manifest)

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag já existe. Atualizando arquivos..."
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar os assets para $tag." }
            gh release edit $tag --draft=false --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { throw "Falha ao marcar $tag como release estável/latest." }
          }
          else {
            Write-Host "Criando release $tag..."
            gh release create $tag @assets `
              --target $env:GITHUB_SHA `
              --title "NITH Converter $tag" `
              --generate-notes `
              --latest
            if ($LASTEXITCODE -ne 0) { throw "Falha ao criar a release $tag." }
          }

          $published = gh release view $tag --json tagName,isDraft,isPrerelease,assets,url | ConvertFrom-Json
          if ($published.isDraft -or $published.isPrerelease) { throw "A release $tag não foi publicada como estável." }
          $requiredNames = @([IO.Path]::GetFileName($installer), [IO.Path]::GetFileName("$installer.sha256"), [IO.Path]::GetFileName($manifest))
          $publishedNames = @($published.assets | ForEach-Object { $_.name })
          foreach ($required in $requiredNames) {
            if ($publishedNames -notcontains $required) { throw "Asset obrigatório ausente na release: $required" }
          }

          $latestTag = gh release view --json tagName --jq '.tagName'
          if ($LASTEXITCODE -ne 0 -or $latestTag.Trim() -ne $tag) { throw "A release $tag não ficou marcada como Latest." }
          Write-Host "Release $tag publicada e marcada como Latest: $($published.url)"

      - name: Validar canal público de atualização
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $manifestUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/nith-update.json"
          $manifest = $null

          for ($attempt = 1; $attempt -le 9; $attempt++) {
            try {
              $manifest = Invoke-RestMethod -Uri $manifestUrl -MaximumRedirection 10 -Headers @{ 'User-Agent' = 'NITHConverter-ReleaseValidator/1.7.1' }
              if ($manifest.version -eq $version -and $manifest.tag -eq $tag) { break }
              throw "Manifesto Latest ainda aponta para $($manifest.version) / $($manifest.tag)."
            }
            catch {
              if ($attempt -eq 9) { throw }
              Write-Host "Aguardando propagação do Latest ($attempt/9): $($_.Exception.Message)"
              Start-Sleep -Seconds 10
            }
          }

          if ($null -eq $manifest) { throw 'Manifesto público não pôde ser lido.' }
          if ($manifest.installer -ne 'NITH.Converter.exe') { throw "Nome inesperado no manifesto: $($manifest.installer)" }

          $installerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($manifest.installer)"
          $header = Join-Path $env:RUNNER_TEMP 'nith-installer-header.bin'
          Remove-Item -LiteralPath $header -Force -ErrorAction SilentlyContinue
          & curl.exe --fail --location --silent --show-error --retry 3 --range 0-1 --max-filesize 1024 --output $header $installerUrl
          if ($LASTEXITCODE -ne 0) { throw 'O asset público do instalador não respondeu ao download.' }
          $bytes = [IO.File]::ReadAllBytes($header)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'O endpoint público do instalador não retornou um executável Windows (MZ).'
          }
          Write-Host "Canal público validado: $manifestUrl -> $version; instalador acessível."

      - name: Guardar artefatos do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NITH-Converter-${{ steps.version.outputs.version }}
          if-no-files-found: warn
          path: |
            artifacts/installer/NITH.Converter.exe
            artifacts/installer/NITH.Converter.exe.sha256
            artifacts/installer/nith-update.json
